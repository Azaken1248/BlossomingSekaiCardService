name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Smoke test
        run: |
          PORT=3051 node index.js > server.log 2>&1 &
          for attempt in $(seq 1 20); do
            curl -sf http://localhost:3051/api/health > /dev/null && break
            sleep 0.5
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3051/api/health)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3051/api/card/not-an-id)" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3051/api/regenerate/100000000000000001)" = 405
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3051/regenerate)" = 200

      - name: Server log
        if: always()
        run: cat server.log || true

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" gitleaks

      - name: Scan the whole history
        run: ./gitleaks git . --redact --no-banner --verbose
